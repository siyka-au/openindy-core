// OpenIndy project file and wire format.
//
// One global id space: every feature, observation and reading has a unique
// int32 id, and cross-references are plain ids (0 is never a valid id).
// Field numbers are part of the format; never reuse or renumber one.
syntax = "proto3";

package openindy.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Shared building blocks
// ---------------------------------------------------------------------------

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// How a feature or reading refers to a measurement config: the config is
// found again by name (and sensor type) in the project's configs or the
// application's standard configs.
message MeasurementConfigRef {
  string name = 1;
  optional string sensor_type = 2;
}

// What every Feature (geometry, station, coordinate system, trafo param,
// group) carries. References are ids in the global id space; 0 means none.
message FeatureCommon {
  int32 id = 1;
  string name = 2;
  string group = 3;
  string comment = 4;
  bool solved = 5;
  bool active = 6;
  // The functions that produce this feature, in execution order.
  repeated FunctionRecord functions = 7;
  repeated int32 used_for = 8;
  repeated int32 previously_needed = 9;
}

// A plugin object (sensor, function, bundle adjustment) is identified by the
// plugin it comes from and its name inside that plugin. The plugin file path
// is not stored: it differs per machine.
message PluginObjectRef {
  string name = 1;
  string plugin = 2;
}

// ---------------------------------------------------------------------------
// Measurement configuration
// ---------------------------------------------------------------------------

enum MeasurementMode {
  MEASUREMENT_MODE_UNSPECIFIED = 0;
  MEASUREMENT_MODE_FAST = 1;
  MEASUREMENT_MODE_STANDARD = 2;
  MEASUREMENT_MODE_PRECISE = 3;
}

enum MeasurementType {
  MEASUREMENT_TYPE_UNSPECIFIED = 0;
  MEASUREMENT_TYPE_SINGLE_POINT = 1;
  MEASUREMENT_TYPE_SCAN_TIME_DEPENDENT = 2;
  MEASUREMENT_TYPE_SCAN_DISTANCE_DEPENDENT = 3;
  MEASUREMENT_TYPE_LEVEL = 4;
  MEASUREMENT_TYPE_DIRECTION = 5;
  MEASUREMENT_TYPE_DISTANCE = 6;
  MEASUREMENT_TYPE_TEMPERATURE = 7;
}

message MeasurementConfig {
  string name = 1;
  MeasurementMode mode = 2;
  MeasurementType type = 3;
  bool measure_two_sides = 4;
  int32 max_observations = 5;
  double time_interval = 6;
  double distance_interval = 7;
  // Id of the sensor type this config is gated to. Absent: not gated.
  optional string sensor_type = 8;
}

// ---------------------------------------------------------------------------
// Readings and observations
// ---------------------------------------------------------------------------

enum SensorFace {
  SENSOR_FACE_UNDEFINED = 0;
  SENSOR_FACE_FRONT = 1;
  SENSOR_FACE_BACK = 2;
}

message PolarReading {
  double azimuth = 1;
  double zenith = 2;
  double distance = 3;
  double sigma_azimuth = 4;
  double sigma_zenith = 5;
  double sigma_distance = 6;
}

message DirectionReading {
  double azimuth = 1;
  double zenith = 2;
  double sigma_azimuth = 3;
  double sigma_zenith = 4;
}

message DistanceReading {
  double distance = 1;
  double sigma_distance = 2;
}

message CartesianReading {
  Vec3 xyz = 1;
  Vec3 sigma_xyz = 2;
}

message Cartesian6DReading {
  Vec3 xyz = 1;
  Vec3 ijk = 2;
  Vec3 sigma_xyz = 3;
}

message TemperatureReading {
  double temperature = 1;
  double sigma_temperature = 2;
}

message LevelReading {
  double i = 1;
  double j = 2;
  double k = 3;
  double sigma_i = 4;
  double sigma_j = 5;
  double sigma_k = 6;
}

// A reading kind the core does not know; its values are kept by name.
message UndefinedReading {
  map<string, double> values = 1;
  map<string, double> sigma_values = 2;
}

message Reading {
  int32 id = 1;
  google.protobuf.Timestamp measured_at = 2;
  bool imported = 3;
  SensorFace face = 4;
  string sensor_config_name = 5;
  optional MeasurementConfigRef measurement_config = 6;
  // The reading's own measurement; which one is set is its type. Other
  // representations (e.g. cartesian from polar) are derived on load.
  oneof data {
    PolarReading polar = 10;
    CartesianReading cartesian = 11;
    Cartesian6DReading cartesian_6d = 12;
    DirectionReading direction = 13;
    DistanceReading distance = 14;
    TemperatureReading temperature = 15;
    LevelReading level = 16;
    UndefinedReading undefined = 17;
  }
}

// An observation is the reading a station took, expressed in coordinates.
// Both the current coordinates and the original ones (in the station system)
// are stored.
message Observation {
  int32 id = 1;
  bool valid = 2;
  bool solved = 3;
  bool dummy_point = 4;
  bool has_direction = 5;
  Vec3 xyz = 6;
  Vec3 original_xyz = 7;
  Vec3 sigma_xyz = 8;
  Vec3 original_sigma_xyz = 9;
  Vec3 ijk = 10;
  Vec3 original_ijk = 11;
  Vec3 sigma_ijk = 12;
  Vec3 original_sigma_ijk = 13;
  int32 station = 14;                 // station id, 0 = none
  int32 measured_target_geometry = 15;  // geometry id, 0 = none
  Reading reading = 16;               // owned by the observation
}

// ---------------------------------------------------------------------------
// Stations, coordinate systems, transformations
// ---------------------------------------------------------------------------

message Station {
  FeatureCommon feature = 1;
  bool active_station = 2;
  repeated PluginObjectRef used_sensors = 3;
  optional PluginObjectRef active_sensor = 4;
  int32 position = 5;           // id of the station's Point
  int32 coordinate_system = 6;  // id of the station's own coordinate system
}

// The parameters the bundle adjustment was last configured with. Values stay
// strings because the template is user-supplied JSON.
message BundleTemplate {
  string name = 1;
  string level_station = 2;
  string max_iterations = 3;
  repeated string parameters = 4;
  PluginObjectRef plugin = 5;
}

message CoordinateSystem {
  FeatureCommon feature = 1;
  bool active_system = 2;
  bool bundle_system = 3;
  Vec3 origin = 4;
  Vec3 x_axis = 5;
  Vec3 y_axis = 6;
  Vec3 z_axis = 7;
  Vec3 expansion_origin = 8;
  optional BundleTemplate bundle_template = 9;
  repeated int32 trafo_params = 10;
  repeated int32 observations = 11;       // station systems
  repeated int32 nominal_geometries = 12; // nominal systems
  // The bundle adjustment attached to a bundle system, if any.
  optional BundleAdjustmentRecord bundle_adjustment = 13;
}

message TrafoParam {
  FeatureCommon feature = 1;
  Vec3 translation = 2;
  Vec3 rotation = 3;  // radians
  Vec3 scale = 4;
  // The 4x4 homogeneous matrix, row-major. Stored rather than recomputed from
  // the parameters: the model has more than one way of building it, and the
  // stored one is exactly what was in use when the project was saved.
  repeated double homogen_matrix = 5;
  bool datum_trafo = 6;
  bool used = 7;
  int32 from = 8;  // coordinate system ids
  int32 to = 9;
}

// ---------------------------------------------------------------------------
// Geometries and groups
// ---------------------------------------------------------------------------

// The statistics a geometry keeps after a fit. The design matrices and the
// per-observation residuals are not stored: a recalculation rebuilds them.
message GeometryStatistic {
  bool valid = 1;
  double s0_apriori = 2;
  double s0_aposteriori = 3;
  double stdev = 4;
  double form_error = 5;
}

// What a point was measured for (feature coding): the feature it serves and
// the role it plays there.
message MeasurementIntent {
  int32 feature_id = 1;
  string role = 2;
}

// Geometry types whose state is fully described by the shared fields
// (position, direction, radius).
message CircleShape {}
message CylinderShape {}
message LineShape {}
message SphereShape {}
message NurbsShape {}

message PointShape {
  repeated MeasurementIntent intents = 1;
}

message PlaneShape {
  // Smallest distance from the origin. Derived from the position and
  // direction, but stored so a reload cannot drift from what was saved.
  double distance_from_origin = 1;
}

message ConeShape {
  // Opening angle: twice the angle between a surface line and the axis.
  double aperture = 1;
}

message EllipseShape {
  double a = 1;
  double b = 2;
  Vec3 semi_major_axis = 3;
}

message EllipsoidShape {
  double a = 1;
  double b = 2;
}

message HyperboloidShape {
  double a = 1;
  double c = 2;
}

message ParaboloidShape {
  double a = 1;
}

message TorusShape {
  // The radius of the centre curve is the geometry's shared radius.
  double radius_b = 1;
}

// A slotted hole keeps its own centre, normal and radius rather than the
// shared ones.
message SlottedHoleShape {
  Vec3 center = 1;
  Vec3 normal = 2;
  double radius = 3;
  double length = 4;
  Vec3 hole_axis = 5;
  Vec3 circle_center_a = 6;
  Vec3 circle_center_b = 7;
}

message PointCloudShape {
  // x, y, z of each point, three floats per point.
  repeated float coordinates = 1 [packed = true];
  // One flag per point: false for points excluded from processing.
  repeated bool used = 2 [packed = true];
  repeated float bbox_min = 3 [packed = true];
  repeated float bbox_max = 4 [packed = true];
  // Geometries detected in the cloud (segments), by id.
  repeated int32 segments = 5;
}

// The four scalar entities hold one number.
message ScalarEntityAngleShape { double angle = 1; }
message ScalarEntityDistanceShape { double distance = 1; }
message ScalarEntityMeasurementSeriesShape { double series_value = 1; }
message ScalarEntityTemperatureShape { double temperature = 1; }

message Geometry {
  FeatureCommon common = 1;

  bool is_common = 2;
  Vec3 position = 3;
  Vec3 direction = 4;
  double radius = 5;
  GeometryStatistic statistic = 6;

  // References, by feature id; 0 means none.
  repeated int32 observations = 7;
  int32 nominal_system = 8;
  // The nominal this geometry realises (many actuals may share one).
  int32 realises = 9;
  // The geometry that generated and owns this one (for example a plane's
  // normal line); owned geometries are regenerated, never edited.
  int32 owner_feature = 10;
  // The measurement config in use; unset if none.
  MeasurementConfigRef measurement_config = 11;

  oneof shape {
    CircleShape circle = 20;
    ConeShape cone = 21;
    CylinderShape cylinder = 22;
    EllipseShape ellipse = 23;
    EllipsoidShape ellipsoid = 24;
    HyperboloidShape hyperboloid = 25;
    LineShape line = 26;
    NurbsShape nurbs = 27;
    ParaboloidShape paraboloid = 28;
    PlaneShape plane = 29;
    PointShape point = 30;
    PointCloudShape point_cloud = 31;
    ScalarEntityAngleShape scalar_angle = 32;
    ScalarEntityDistanceShape scalar_distance = 33;
    ScalarEntityMeasurementSeriesShape scalar_measurement_series = 34;
    ScalarEntityTemperatureShape scalar_temperature = 35;
    SlottedHoleShape slotted_hole = 36;
    SphereShape sphere = 37;
    TorusShape torus = 38;
  }
}

// What kind of feature a group accepts. Wire numbering is independent of
// the model's enum.
enum FeatureKind {
  FEATURE_KIND_UNSPECIFIED = 0;
  FEATURE_KIND_CIRCLE = 1;
  FEATURE_KIND_CONE = 2;
  FEATURE_KIND_CYLINDER = 3;
  FEATURE_KIND_ELLIPSE = 4;
  FEATURE_KIND_ELLIPSOID = 5;
  FEATURE_KIND_HYPERBOLOID = 6;
  FEATURE_KIND_LINE = 7;
  FEATURE_KIND_NURBS = 8;
  FEATURE_KIND_PARABOLOID = 9;
  FEATURE_KIND_PLANE = 10;
  FEATURE_KIND_POINT = 11;
  FEATURE_KIND_POINT_CLOUD = 12;
  FEATURE_KIND_SCALAR_ANGLE = 13;
  FEATURE_KIND_SCALAR_DISTANCE = 14;
  FEATURE_KIND_SCALAR_MEASUREMENT_SERIES = 15;
  FEATURE_KIND_SCALAR_TEMPERATURE = 16;
  FEATURE_KIND_SLOTTED_HOLE = 17;
  FEATURE_KIND_SPHERE = 18;
  FEATURE_KIND_TORUS = 19;
  FEATURE_KIND_COORDINATE_SYSTEM = 20;
  FEATURE_KIND_STATION = 21;
  FEATURE_KIND_TRAFO_PARAM = 22;
  FEATURE_KIND_LEVEL = 23;
  FEATURE_KIND_GROUP = 24;
  FEATURE_KIND_POINT_GROUP = 25;
}

// A named collection of references to other features.
message Group {
  FeatureCommon common = 1;
  // Set when the group only accepts one kind of feature.
  FeatureKind constraint = 2;
  repeated int32 members = 3;
  // A point group is a group constrained to points with the point-collection
  // behaviour on top.
  bool point_group = 4;
}

// ---------------------------------------------------------------------------
// Functions
//
// A function is stored as a reference to the plugin object that implements it
// plus the user-facing state that makes a project reproducible: its inputs,
// pipeline stages and parameters. Whatever the plugin computes (results,
// residual statistics, protocols) is recomputed on load and not stored.
// ---------------------------------------------------------------------------

// What kind of thing a function takes as input. Wire numbering is independent
// of the model's enum.
enum ElementKind {
  ELEMENT_KIND_UNSPECIFIED = 0;
  ELEMENT_KIND_CIRCLE = 1;
  ELEMENT_KIND_CONE = 2;
  ELEMENT_KIND_CYLINDER = 3;
  ELEMENT_KIND_ELLIPSE = 4;
  ELEMENT_KIND_ELLIPSOID = 5;
  ELEMENT_KIND_HYPERBOLOID = 6;
  ELEMENT_KIND_LINE = 7;
  ELEMENT_KIND_NURBS = 8;
  ELEMENT_KIND_PARABOLOID = 9;
  ELEMENT_KIND_PLANE = 10;
  ELEMENT_KIND_POINT = 11;
  ELEMENT_KIND_POINT_CLOUD = 12;
  ELEMENT_KIND_SCALAR_ENTITY_ANGLE = 13;
  ELEMENT_KIND_SCALAR_ENTITY_DISTANCE = 14;
  ELEMENT_KIND_SCALAR_ENTITY_MEASUREMENT_SERIES = 15;
  ELEMENT_KIND_SCALAR_ENTITY_TEMPERATURE = 16;
  ELEMENT_KIND_SLOTTED_HOLE = 17;
  ELEMENT_KIND_SPHERE = 18;
  ELEMENT_KIND_TORUS = 19;
  ELEMENT_KIND_DIRECTION = 20;
  ELEMENT_KIND_POSITION = 21;
  ELEMENT_KIND_RADIUS = 22;
  ELEMENT_KIND_COORDINATE_SYSTEM = 23;
  ELEMENT_KIND_STATION = 24;
  ELEMENT_KIND_TRAFO_PARAM = 25;
  ELEMENT_KIND_OBSERVATION = 26;
  ELEMENT_KIND_READING_CARTESIAN = 27;
  ELEMENT_KIND_READING_POLAR = 28;
  ELEMENT_KIND_READING_DISTANCE = 29;
  ELEMENT_KIND_READING_DIRECTION = 30;
  ELEMENT_KIND_READING_TEMPERATURE = 31;
  ELEMENT_KIND_READING_LEVEL = 32;
  ELEMENT_KIND_UNDEFINED = 33;
  ELEMENT_KIND_LEVEL = 34;
  ELEMENT_KIND_POINT_COLLECTION = 35;
}

// A single unknown of a geometry, as named in fixed-parameter and
// ignored-parameter lists.
enum GeometryParameter {
  GEOMETRY_PARAMETER_UNSPECIFIED = 0;
  GEOMETRY_PARAMETER_UNKNOWN_X = 1;
  GEOMETRY_PARAMETER_UNKNOWN_Y = 2;
  GEOMETRY_PARAMETER_UNKNOWN_Z = 3;
  GEOMETRY_PARAMETER_UNKNOWN_PRIMARY_I = 4;
  GEOMETRY_PARAMETER_UNKNOWN_PRIMARY_J = 5;
  GEOMETRY_PARAMETER_UNKNOWN_PRIMARY_K = 6;
  GEOMETRY_PARAMETER_UNKNOWN_SECONDARY_I = 7;
  GEOMETRY_PARAMETER_UNKNOWN_SECONDARY_J = 8;
  GEOMETRY_PARAMETER_UNKNOWN_SECONDARY_K = 9;
  GEOMETRY_PARAMETER_UNKNOWN_RADIUS_A = 10;
  GEOMETRY_PARAMETER_UNKNOWN_RADIUS_B = 11;
  GEOMETRY_PARAMETER_UNKNOWN_APERTURE = 12;
  GEOMETRY_PARAMETER_UNKNOWN_A = 13;
  GEOMETRY_PARAMETER_UNKNOWN_B = 14;
  GEOMETRY_PARAMETER_UNKNOWN_C = 15;
  GEOMETRY_PARAMETER_UNKNOWN_ANGLE = 16;
  GEOMETRY_PARAMETER_UNKNOWN_DISTANCE = 17;
  GEOMETRY_PARAMETER_UNKNOWN_MEASUREMENT_SERIES = 18;
  GEOMETRY_PARAMETER_UNKNOWN_TEMPERATURE = 19;
  GEOMETRY_PARAMETER_UNKNOWN_LENGTH = 20;
}

enum PipelineStageKind {
  PIPELINE_STAGE_KIND_UNSPECIFIED = 0;
  // only the listed element ids survive
  PIPELINE_STAGE_KIND_EXPLICIT_LIST = 1;
  // the listed element ids are dropped, each with a reason
  PIPELINE_STAGE_KIND_EXCLUDE = 2;
  // drop candidates whose fit residual exceeds sigma_multiplier * stdev
  PIPELINE_STAGE_KIND_RESIDUAL_OUTLIER_REJECTION = 3;
}

message PipelineExclusion {
  int32 element_id = 1;
  string reason = 2;
}

message PipelineStage {
  PipelineStageKind kind = 1;
  repeated int32 explicit_ids = 2;
  repeated PipelineExclusion exclusions = 3;
  double sigma_multiplier = 4;
}

// The declared pipeline of one input position of a function.
message FunctionPipeline {
  int32 position = 1;
  repeated PipelineStage stages = 2;
}

message FunctionInput {
  // Which input slot of the function (the function declares what each
  // position accepts).
  int32 position = 1;
  int32 element_id = 2;
  ElementKind kind = 3;
  string label = 4;
  // Single unknowns of this input that the function must not use.
  repeated GeometryParameter ignored_destination = 5;
  // Single unknowns of the result that this input must not influence.
  repeated GeometryParameter ignored_target = 6;
  bool should_be_used = 7;
  bool is_used = 8;
}

message IntParameter {
  string name = 1;
  int32 value = 2;
}

message DoubleParameter {
  string name = 1;
  double value = 2;
}

message StringParameter {
  string name = 1;
  string value = 2;
}

message FixedParameter {
  GeometryParameter parameter = 1;
  double value = 2;
}

message FunctionRecord {
  // Which function: its name and the plugin it comes from.
  PluginObjectRef plugin = 1;
  repeated FunctionInput inputs = 2;
  repeated FunctionPipeline pipelines = 3;
  // Parameters are written in name order, so that saving twice gives the
  // same bytes.
  repeated IntParameter int_parameters = 4;
  repeated DoubleParameter double_parameters = 5;
  repeated StringParameter string_parameters = 6;
  repeated FixedParameter fixed_parameters = 7;
}

// ---------------------------------------------------------------------------
// Bundle adjustment
//
// The state a bundle adjustment plugin holds between sessions: which stations
// and geometries take part, what to solve for, and what it solved. Ids are
// feature ids.
// ---------------------------------------------------------------------------

enum TrafoParameter {
  TRAFO_PARAMETER_UNSPECIFIED = 0;
  TRAFO_PARAMETER_TRANSLATION_X = 1;
  TRAFO_PARAMETER_TRANSLATION_Y = 2;
  TRAFO_PARAMETER_TRANSLATION_Z = 3;
  TRAFO_PARAMETER_ROTATION_X = 4;
  TRAFO_PARAMETER_ROTATION_Y = 5;
  TRAFO_PARAMETER_ROTATION_Z = 6;
  TRAFO_PARAMETER_SCALE_X = 7;
  TRAFO_PARAMETER_SCALE_Y = 8;
  TRAFO_PARAMETER_SCALE_Z = 9;
}

message GeometryParameterValue {
  GeometryParameter parameter = 1;
  double value = 2;
}

message TrafoParameterValue {
  TrafoParameter parameter = 1;
  double value = 2;
}

message BundleGeometry {
  int32 id = 1;
  repeated GeometryParameterValue parameters = 2;
}

message BundleTransformation {
  int32 id = 1;
  repeated TrafoParameterValue parameters = 2;
}

message BundleStation {
  int32 id = 1;
  // which parameters of the station's transformation to solve for
  bool tx = 2;
  bool ty = 3;
  bool tz = 4;
  bool rx = 5;
  bool ry = 6;
  bool rz = 7;
  bool m = 8;
  // geometries solved in the station's system
  repeated BundleGeometry geometries = 9;
}

message BundleAdjustmentRecord {
  PluginObjectRef plugin = 1;
  repeated BundleStation stations = 2;
  // The station the others are tied to; 0 if none. One of `stations`.
  int32 base_station = 3;
  repeated BundleGeometry geometries = 4;
  repeated BundleTransformation transformations = 5;
}

// ---------------------------------------------------------------------------
// Project
// ---------------------------------------------------------------------------

message Project {
  // Bumped when the schema changes in a way readers must know about.
  uint32 format_version = 1;
  string name = 2;
  google.protobuf.Timestamp saved_at = 3;
  // Version of the application that wrote the file (informational).
  string app_version = 4;
  // The next id the job will hand out, so reloading never reuses an id.
  int32 next_id = 5;
  // The station and coordinate system that were active; both must exist.
  int32 active_station = 6;
  int32 active_coordinate_system = 7;
  // SHA-256 (hex) over the project's content, excluding the fields that
  // change on every save (saved_at, app_version, digest). Equal digests mean
  // the project did not change.
  string digest = 8;

  // Only the configs the project itself defines; standard configs belong to
  // the application and are found again by name.
  repeated MeasurementConfig measurement_configs = 16;
  repeated Geometry geometries = 17;
  repeated Group groups = 18;
  repeated Station stations = 19;
  // Nominal, bundle and station coordinate systems alike.
  repeated CoordinateSystem coordinate_systems = 20;
  repeated TrafoParam trafo_params = 21;
  repeated Observation observations = 22;
}
